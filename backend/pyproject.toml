[project]
name = "dragon-boat-guide-backend"
version = "0.1.0"
description = "FastAPI backend for the travel planning fullstack migration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn==0.49.0",
  "sqlalchemy==2.0.50",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "aiosqlite==0.22.1"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"